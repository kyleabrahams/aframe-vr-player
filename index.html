<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="assets/vr.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="libs/aframe/aframe-v1.7.1.js"></script>
  <script src="main/main.js" type="module"></script>
  <title>aframe vr player</title>
</head>

<body>
  <input type="file" id="fileInput" accept="video/*" multiple style="display: none;">

  <a-scene background="color: #1a1a1a">

    
    
    

    <a-assets>
      <img id="asset-vp-play" src="assets/play.png">
      <img id="asset-vp-pause" src="assets/pause.png">
      <img id="asset-vp-stop" src="assets/stop.png">
      <img id="asset-vp-seek-forward" src="assets/seek-forward.png">
      <img id="asset-vp-seek-backward" src="assets/seek-backward.png">
      <img id="asset-vp-hide-ui" src="assets/hide-ui.png">
      <img id="asset-vp-open-file" src="assets/open-file.png">
      <img id="asset-vp-voli" src="assets/vol-incr.png">
      <img id="asset-vp-vold" src="assets/vol-decr.png">
      <img id="asset-back" src="assets/back.png">
      <img id="asset-loading" src="assets/loading.gif">
      <img id="asset-up" src="assets/up.png">
      <img id="asset-hide-files" src="assets/hide-files-ui.png">
      <img id="asset-folder" src="assets/folder.png">
      <img id="asset-movie-icon" src="assets/movie.png">
      <img id="asset-unknown" src="assets/unknown.png">
      <img id="asset-refresh" src="assets/refresh.png">
      <img id="asset-settings" src="assets/settings.png">
      <img id="asset-check" src="assets/check.png">
      <img id="asset-uncheck" src="assets/uncheck.png">
      <img id="asset-arrow" src="assets/arrow.png">
    </a-assets>

    <video id="video" crossorigin="anonymous" playsinline webkit-playsinline></video>

    <!-- camera stuff restored -->
    
      
        
          

            <!-- cursor dot stuff restored -->
            

            <!-- subtitles -->
            <a-text id="subtitles" position="0 -1.5 -5" width="5" align="center">
              <a-plane visible="false"></a-plane>
            </a-text>

          
        
      
    

    <!-- video player background manager restored -->
    

    <!-- video player ui title header pointing securely to CDN font paths -->
    <a-text id="vrVideoTitle" 
            value="No File Loaded" 
            font="https://aframe.io"
            font-image="https://aframe.io"
            position="0 7.5 -60" 
            width="45" 
            align="center" 
            color="#FFF" 
            wrap-count="50">
    </a-text>

    <!-- video player ui tray container layout fully restored -->
    

      

      

      <a-image btn-open-file clickable button-highlight controls src="#asset-vp-open-file" position="-14 -5 -60" scale="5 5 1"></a-image>
      <a-image btn-seek-back clickable button-highlight controls src="#asset-vp-seek-backward" position="-7 -5 -60" scale="5 5 1"></a-image>
      <a-image btn-pause-play clickable button-highlight controls src="#asset-vp-play" position="0 -5 -60" scale="5 5 1"></a-image>
      <a-image btn-seek-forw clickable button-highlight controls src="#asset-vp-seek-forward" position="7 -5 -60" scale="5 5 1"></a-image>
      <a-image btn-hide-controls clickable button-highlight controls src="#asset-vp-hide-ui" position="14 -5 -60" scale="5 5 1"></a-image>
      <a-image btn-settings clickable button-highlight controls src="#asset-settings" position="21 -5 -60" scale="5 5 1"></a-image>

      
      

    

  </a-scene>
</body>

</html>
